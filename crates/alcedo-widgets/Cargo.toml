[package]
name = "alcedo-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sidebar web widgets for Alcedo"

[dependencies]
alcedo-core = { workspace = true }
gtk4 = { workspace = true, features = ["v4_18"] }
libadwaita = { workspace = true, features = ["v1_7", "gtk_v4_18"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
webkit6 = { workspace = true, features = ["gtk_v4_18"] }
